name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test

  regtest:
    name: Claim on a real Bitcoin node (regtest)
    runs-on: ubuntu-latest
    env:
      BITCOIN_VERSION: "28.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Download Bitcoin Core and verify its checksum
        run: |
          mkdir -p "$RUNNER_TEMP/bitcoin" && cd "$RUNNER_TEMP/bitcoin"
          base="https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}"
          tarball="bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/SHA256SUMS"
          grep " $tarball\$" SHA256SUMS | sha256sum -c -
          tar xzf "$tarball"
          echo "BITCOIN_BIN=$RUNNER_TEMP/bitcoin/bitcoin-${BITCOIN_VERSION}/bin" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: server
      - run: npm run test:regtest
        working-directory: server

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
